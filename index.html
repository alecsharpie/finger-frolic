<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finger Frolic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="stylesheet" href="shared/theme.css">
<style>
  html, body { overflow: hidden; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
  .over { position: fixed; inset: 0; display: grid; place-items: center; padding: 3vh 3vw; background: rgba(16, 9, 34, .6); }
  /* pixel panels and buttons: notched corners, a hard inked edge and a drop shadow, no rounding */
  .panel { --n: 8px; position: relative; background: var(--panel); clip-path: polygon(var(--n) 0, calc(100% - var(--n)) 0, 100% var(--n), 100% calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%, 0 calc(100% - var(--n)), 0 var(--n));
    box-shadow: inset 0 0 0 4px #140b26, inset 4px 4px 0 4px #4a3a86, inset -4px -4px 0 4px #1e1440; }
  .card { display: grid; grid-template-columns: auto 1fr; gap: 3.5vh 3vw; align-items: start; width: min(1240px, 100%); padding: 4.5vh 3.2vw; }
  .logo { display: block; margin: 0 0 1.2vh -4px; }
  .tag { color: var(--ink-2); font-size: clamp(16px, 2.3vh, 24px); }
  .qrbox { display: flex; flex-direction: column; gap: 1.4vh; align-items: center; }
  .qr { background: #fff; padding: 10px; width: min(30vh, 300px); aspect-ratio: 1; box-shadow: 0 0 0 4px #140b26, 6px 6px 0 4px #0b0618; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .codeline { display: flex; align-items: center; gap: 18px; margin-top: 2.4vh; flex-wrap: wrap; }
  .codeline .lbl { color: var(--ink-2); font-size: clamp(14px, 1.9vh, 19px); line-height: 1.3; }
  .url { color: var(--ink-2); font-size: clamp(13px, 1.7vh, 17px); word-break: break-all; }
  .warn { color: var(--bad); font-size: 16px; margin-top: 8px; }
  .players { display: flex; flex-wrap: wrap; gap: 10px; margin: 2.6vh 0 2vh; min-height: 52px; align-items: center; }
  .pl { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 6px; background: var(--bg-2); box-shadow: inset 0 0 0 3px var(--c), 4px 4px 0 0 #0b0618; font-size: clamp(16px, 2.4vh, 24px); font-weight: 700; }
  .pl.off { opacity: .45; }
  .empty { color: var(--ink-2); font-size: clamp(16px, 2.2vh, 22px); }
  .btn { border: 0; border-radius: 0; background: var(--panel); box-shadow: inset 0 0 0 3px #140b26, inset 3px 3px 0 3px #5a4a9a, 4px 4px 0 0 #0b0618; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
  .btn:active { transform: translate(2px, 2px); box-shadow: inset 0 0 0 3px #140b26, inset 3px 3px 0 3px #5a4a9a, 2px 2px 0 0 #0b0618; }
  .btn.go { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 3px #140b26, inset 3px 3px 0 3px #fff3a0, 4px 4px 0 0 #0b0618; }
  .btn.on { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 3px #140b26, inset 3px 3px 0 3px #fff3a0, 4px 4px 0 0 #0b0618; outline: 0; }
  .diffs { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 2.4vh; }
  .hint { color: var(--ink-2); font-size: clamp(13px, 1.7vh, 16px); display: inline-flex; align-items: center; gap: 6px; }
  .prompt { font-size: clamp(18px, 2.7vh, 28px); font-weight: 700; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .prompt b { color: var(--accent); }
  .how { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .how > div { padding: 16px 16px 18px; background: var(--bg-2); box-shadow: inset 0 0 0 3px #140b26, 4px 4px 0 0 #0b0618; font-size: clamp(14px, 1.85vh, 19px); line-height: 1.35; color: var(--ink-2); }
  .how h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 1.2em; color: var(--ink); font-weight: 700; }
  .how .runes { display: flex; gap: 4px; margin-top: 8px; }
  .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: clamp(13px, 1.7vh, 17px); margin-top: -1vh; }
  .foot a { color: var(--ink-2); }
  .rank { width: 100%; border-collapse: collapse; font-size: clamp(16px, 2.3vh, 26px); margin: 2vh 0; }
  .rank td { padding: 8px 10px; border-bottom: 3px solid #140b26; vertical-align: middle; }
  .rank td.n { width: 1%; white-space: nowrap; }
  .rank td.s { text-align: right; }
  .rank .who { font-weight: 700; }
  .rank .award { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; padding: 2px 10px 2px 4px; background: var(--bg-2); box-shadow: inset 0 0 0 2px #140b26; font-size: .78em; }
  .rank small { display: block; color: var(--ink-2); font-size: .66em; margin-top: 2px; }
  #banner { position: fixed; left: 0; right: 0; top: 24vh; display: flex; flex-direction: column; align-items: center; gap: 2vh; pointer-events: none; transition: opacity .2s; }
  #banner .sub { display: flex; align-items: center; gap: 12px; padding: 10px 22px; background: rgba(16, 9, 34, .82); box-shadow: inset 0 0 0 3px #140b26; color: #fff; font-size: clamp(18px, 3vh, 34px); font-weight: 700; }
  #corner { position: fixed; right: 2vh; top: 1.6vh; display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; background: rgba(16, 9, 34, .82); box-shadow: inset 0 0 0 3px #140b26; }
  #corner .qr { width: 9vh; padding: 4px; box-shadow: none; }
  #corner .lbl { color: var(--ink-2); font-size: 15px; }
  #sound { position: fixed; left: 50%; bottom: 2vh; transform: translateX(-50%); }
  #status { position: fixed; left: 2vh; bottom: 2vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="banner"></div>
<div id="corner" class="hidden"></div>
<div id="lobby" class="over"></div>
<div id="results" class="over hidden"></div>
<button id="sound" class="btn sm"></button>
<div id="status" class="chip hidden"></div>
<script type="module">
import { hostRoom, param } from './shared/net.js';
import { findLan, joinUrl, qrSvg, stuckOnLocalhost } from './shared/lobby.js';
import { Sfx } from './shared/audio.js';
import { SEATS, KINDS, INTRO, DIFFS, DIFF_KEYS, newGame, addPlayer, startGame, startWave, step, swipe, breakOver, ranking, awards, need, aim, isBossWave, isShapeToken, MULTI_NAMES } from './game.js';
import { drawField, tickFx, warmUp, fx, burst, popup, spell, dying, bolt, hitStop, orbs, seatColor, BODY } from './draw.js';
import { SHAPES } from './shared/shapes.js';
import { pic, ptext } from './shared/ui.js';
import { DIFF_ICON, AWARD_ICON } from './icons.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cv = $('cv'), ctx = cv.getContext('2d');
const sfx = new Sfx();

let diff = DIFF_KEYS.includes(param('diff')) ? param('diff') : (localStorage.getItem('frolic-diff') || 'normal');
if (!DIFFS[diff]) diff = 'normal';
let G = newGame(undefined, diff);
warmUp();
let mode = 'lobby';         // lobby | countdown | play (then G.phase says wave / break / over)
let countdown = 0, bannerUntil = 0, overAt = 0;
const ready = new Set();
const offSince = {};

await findLan();
const room = hostRoom({ game: 'frolic', seats: SEATS, onSeats: () => { dirty = true; renderOverlays(); }, onAction, onStatus });
const url = joinUrl(room.room);
const qr = qrSvg(url);

const live = s => room.connected(s);
const nameOf = s => (room.seat(s)?.name || '').trim() || 'Player ' + s.slice(1);
const present = () => SEATS.filter(s => room.seat(s) && live(s));

function onStatus(s, e) {
  const el = $('status');
  el.classList.toggle('hidden', s === 'open');
  el.innerHTML = s === 'retrying' ? `<span class="dot"></span> ${esc(e?.message || 'reconnecting to the game server')}…` : '<span class="dot"></span> connecting…';
}

// ---------- input from phones ----------
function onAction(seat, body) {
  if (!body || typeof body.s !== 'string') return;
  addPlayer(G, seat, nameOf(seat));
  if (mode === 'lobby' || (mode === 'play' && G.phase === 'over')) {
    // a grace period on the results, so a last frantic swipe up does not skip them
    if (G.phase === 'over' && performance.now() - overAt < 3000) return;
    if (body.s === 'u' && !ready.has(seat)) { ready.add(seat); sfx.tick(); dirty = true; renderOverlays(); maybeStart(); }
    if (body.s === 'l' || body.s === 'r') setDiff(body.s === 'r' ? 1 : -1);
    return;
  }
  if (mode !== 'play') return;
  const res = swipe(G, seat, body.s);
  if (res) dirty = true;
  drainLog();
}

function setDiff(step, to) {
  const i = DIFF_KEYS.indexOf(diff);
  diff = to || DIFF_KEYS[Math.max(0, Math.min(DIFF_KEYS.length - 1, i + step))];
  try { localStorage.setItem('frolic-diff', diff); } catch (e) {}
  G.diff = diff; sfx.tick(); dirty = true; renderOverlays();
}

function maybeStart() {
  const here = present();
  if (here.length && here.every(s => ready.has(s))) beginCountdown();
}

function beginCountdown() {
  if (!present().length) return;
  mode = 'countdown'; countdown = 3.99; ready.clear(); dirty = true;
  sfx.select();
  renderOverlays();
}

// ---------- turning rules events into sound and sparkle ----------
let Lo = null;
function drainLog() {
  if (!Lo) { G.log.length = 0; return; }
  const H = cv.height, W = cv.width;
  if (G.log.length) dirty = true;
  for (const [k, ...a] of G.log.splice(0)) {
    if (k === 'hit') {
      // lane: whose arrows were hit; from: the lane of the player who swiped (different when helping a neighbour)
      // lane: whose arrows were hit; from: the caster's lane (different when helping a neighbour)
      const [lane, id, token, from, ey0] = a, seat = G.lanes[from], p = G.players[seat];
      const hx = Lo.laneX(from), hy = Lo.wall, tx = Lo.laneX(lane), ey = Lo.yOf(ey0);
      spell(token, { x: hx + 7 * Lo.s, y: Lo.wall - 18 * Lo.s }, { x: tx, y: ey }, seatColor(seat), id);
      burst(hx + 7 * Lo.s, Lo.wall - 20 * Lo.s, seatColor(seat), 5, 220);
      spellFor[id] = token;
      if (isShapeToken(token)) { popup(tx, ey - H * 0.15, SHAPE_SPELL[token], 'violet', 2); sfx.cast(token); }
      if (lane !== from) popup(tx, hy - H * 0.16, 'HELP!', seatColor(seat), 1);
      fx.lunge[seat] = 1;
      sfx.slash(p.combo);
      if (p.combo && p.combo % 10 === 0) { popup(hx, hy - H * 0.12, `${p.combo} COMBO!`, 'flame', 2); sfx.rep(p.combo / 10 + 4); }
    } else if (k === 'miss') {
      const [lane] = a; sfx.wrong(); popup(Lo.laneX(lane), Lo.wall - H * 0.1, 'DIZZY', 'gold', 1);
    } else if (k === 'kill') {
      const [lane, id, kind, y, how, killer] = a, ey = Lo.yOf(y);
      if (kind === 'boss') {
        sfx.boom(); fx.shake = 30; fx.flash = 1; fx.flashColor = '#ffd23f';
        for (let i = 0; i < G.lanes.length; i++) burst(Lo.laneX(i), ey, '#ffd23f', 40, 700);
        banner('BOSS DOWN!', 'gold', `${pic('crown', 28)} +${KINDS.boss.points} each, and a heart back`, 2.5);
      } else {
        // the monster flashes until the spell that killed it lands, then bursts into its own pixels; the game holds
        // still for a beat, and soul orbs fly home to whoever cast it
        const tok = spellFor[id], big = isShapeToken(tok) || kind === 'golem' || kind === 'brute';
        const delay = how === 'swipe' ? ({ circle: 0.28, tri: 0.3, square: 0.32, zig: 0.34, v: 0.3 }[tok] || 0.13) : 0.02;
        delete spellFor[id];
        const ci = G.lanes.indexOf(killer), mx = Lo.laneX(lane);
        dying(kind, mx, ey, delay, () => {
          sfx.splat(); fx.shake = Math.max(fx.shake, big ? 10 : 5); hitStop(big ? 0.08 : 0.045);
          if (ci >= 0) orbs(Math.max(3, Math.min(8, Math.round(KINDS[kind].points / 30))), mx, ey, Lo.laneX(ci), Lo.wall - 10 * Lo.s, seatColor(killer), killer);
        }, big ? 1.4 : 1);
        if (how !== 'mega') popup(Lo.laneX(lane), ey - H * 0.06, '+' + KINDS[kind].points * (G.frenzyT > 0 ? 2 : 1), G.frenzyT > 0 ? 'flame' : 'white', 1);
      }
    } else if (k === 'multi') {
      const [seat, n] = a, i = G.lanes.indexOf(seat);
      if (i >= 0) popup(Lo.laneX(i), Lo.wall - H * 0.2, MULTI_NAMES[n], n >= 4 ? 'flame' : 'gold', n >= 3 ? 3 : 2, 1.2, 'multi' + seat);
      sfx.multi(n);
    } else if (k === 'close') {
      const [lane, seat] = a;
      popup(Lo.laneX(lane), Lo.wall - H * 0.12, 'CLOSE CALL!', 'gold', 2, 1.3, 'close' + lane); popup(Lo.laneX(lane), Lo.wall - H * 0.07, '+100', 'gold', 1, 1.3);
      hitStop(0.14); fx.flash = 0.5; fx.flashColor = '#ffe14d'; sfx.close();
    } else if (k === 'mega') {
      fx.pops = []; // the mega spell gets the screen to itself
      hitStop(0.3); fx.shake = 34; fx.flash = 1; fx.flashColor = '#c69cff'; sfx.mega();
      for (let i = 0; i < G.lanes.length; i++) bolt(Lo.laneX(i), Lo.wall - 40 * Lo.s);
      banner('MEGA SPELL!', 'violet', `${pic('sparkle', 28)} Every wizard at once. The whole field, gone.`, 2.8);
    } else if (k === 'gift') {
      sfx.chime(); popup(Lo.laneX(a[0]), Lo.top + H * 0.14, 'GIFT!', 'gold', 1);
    } else if (k === 'escape') {
      popup(Lo.laneX(a[0]), Lo.wall - H * 0.05, 'IT GOT AWAY', 'gold', 1);
    } else if (k === 'power') {
      const [kind, seat] = a, who = nameOf(seat);
      if (kind === 'freeze') { sfx.freeze(); fx.flash = 0.8; fx.flashColor = '#bfe8ff'; banner('FREEZE!', 'ice', `${pic('snow', 28)} ${esc(who)} froze the field`, 2); }
      if (kind === 'heal') { sfx.heal(); fx.flash = 0.6; fx.flashColor = '#ff6b9a'; banner('+1 HEART', 'red', `${pic('heart', 28)} A gift from ${esc(who)}`, 2); }
      if (kind === 'storm') { sfx.zap(); fx.shake = 20; fx.flash = 1; fx.flashColor = '#ffffff'; banner('LIGHTNING!', 'gold', `${pic('bolt', 28)} ${esc(who)} called down the storm`, 2); }
    } else if (k === 'bolt') {
      const [lane, y] = a; bolt(Lo.laneX(lane), Lo.yOf(y));
    } else if (k === 'frenzy') {
      sfx.frenzy(); sfx.bpm = baseBpm + 30; fx.flash = 0.7; fx.flashColor = '#ffb02e';
      banner('FRENZY!', 'flame', `${pic('flame', 28)} Double points. Double knockback. Supers charge twice as fast.`, 2.5);
    } else if (k === 'frenzy-end') {
      sfx.bpm = baseBpm;
    } else if (k === 'super') {
      const [lane] = a, x = Lo.laneX(lane);
      sfx.bomb(); fx.shake = 18; fx.flash = 0.8; fx.flashColor = seatColor(G.lanes[lane]);
      for (let i = 0; i < 6; i++) burst(x, Lo.top + (Lo.wall - Lo.top) * (i / 5), seatColor(G.lanes[lane]), 16, 500);
      popup(x, (Lo.top + Lo.wall) / 2, 'SUPER!', 'white', 3);
    } else if (k === 'breach') {
      const [lane, , lost] = a;
      sfx.breach(); fx.shake = 22; fx.flash = 1; fx.flashColor = '#ff3355';
      popup(lane >= 0 ? Lo.laneX(lane) : W / 2, Lo.wall - H * 0.05, lost > 1 ? `-${lost} HEARTS` : '-1 HEART', 'red', 2);
    } else if (k === 'wave') {
      const [n, fresh] = a; sfx.horn();
      const sub = isBossWave(n) ? `${pic('boss', 36)} Boss wave. It falls when everyone clears their row.`
        : fresh.length ? fresh.map(f => `${pic(f, 32)} ${INTRO[f]}`).join('&emsp;') : '';
      banner(`WAVE ${n}`, 'white', sub, fresh.length || isBossWave(n) ? 3.5 : 2.2);
      baseBpm = 116 + Math.min(40, n * 3); sfx.bpm = baseBpm;
    } else if (k === 'cleared') {
      const [n, perfect] = a;
      sfx.cheer();
      if (perfect) { burst(W / 2, H * 0.4, '#ffd23f', 60, 900); burst(W / 2, H * 0.4, '#ffffff', 30, 700); }
      banner(perfect ? 'PERFECT!' : 'WAVE CLEAR', perfect ? 'gold' : 'white',
        perfect ? `${pic('sparkle', 28)} Not a heart lost. +${100 * n} each` : 'Catch your breath. New wizards can join now.', 3.2);
    } else if (k === 'over') {
      sfx.stopMusic(); sfx.hurt(); ready.clear(); overAt = performance.now(); renderOverlays();
    }
  }
}
let baseBpm = 120;
fx.onOrb = (seat, i, n) => { sfx.pling(i); if (i === n - 1) fx.glow[seat] = 1; };
const spellFor = {}; // enemy id -> the token of the last spell cast at it
const SHAPE_SPELL = { circle: 'FIREBALL!', tri: 'LIGHTNING!', square: 'ICE CAGE!', zig: 'WHIRLWIND!', v: 'SMITE!' };

// A big pixel-font line, and an optional sub line (HTML, may hold pixel icons).
function banner(title, color = 'white', sub = '', secs = 2) {
  const big = Math.round(Math.min(innerHeight * 0.1, innerWidth * 0.7 / Math.max(4, title.length * 0.62)));
  const html = ptext(title, big, color) + (sub ? `<div class="sub">${sub}</div>` : '');
  if ($('banner').innerHTML !== html) $('banner').innerHTML = html;
  bannerUntil = performance.now() + secs * 1000;
}

// ---------- the TV's overlays ----------
const rune = g => pic('chip:' + g, 30);
const n = (k, word) => `${k} ${word}${k === 1 ? '' : 's'}`;
const HOW = `
  <div class="how">
    <div><h3>${pic('wand', 30)} Swipe to cast</h3>Swipe the arrows over the monster in your lane, in order. Every swipe fires a spell. Wrong way and you're dizzy.</div>
    <div><h3>${pic('pencil', 30)} Draw the runes</h3>Purple runes need a shape. Draw it on your phone in one stroke.<div class="runes">${['circle', 'tri', 'v', 'square', 'zig'].map(rune).join('')}</div></div>
    <div><h3>${pic('shield', 30)} Mind your friends</h3>Lane clear? Your spells fly to the lanes beside you. Fill your meter and tap for a super. All tap together for a mega spell.</div>
    <div><h3>${pic('gift', 30)} Gifts and frenzy</h3>Pop gifts for a freeze, a heart or a lightning storm. Teamwork fills the frenzy meter: double points.</div>
  </div>`;

function playersHtml() {
  const seats = SEATS.filter(s => room.seat(s));
  if (!seats.length) return '<div class="empty">No wizards yet. Scan the code to join.</div>';
  return seats.map(s => `<div class="pl${live(s) ? '' : ' off'}" style="--c:${seatColor(s)}">${pic('wizard:' + seatColor(s), 40)}${esc(nameOf(s))}${ready.has(s) ? ' ' + pic('check', 22) : ''}${live(s) ? '' : ' <small>reconnecting</small>'}</div>`).join('');
}

function diffHtml() {
  return `<div class="diffs">${DIFF_KEYS.map(k => `<button class="btn sm${k === diff ? ' on' : ''}" data-diff="${k}">${pic(DIFF_ICON[k], 24)}${DIFFS[k].label}</button>`).join('')}
    <span class="hint">or swipe ${pic('arrowL', 14)} ${pic('arrowR', 14)} on a phone</span></div>`;
}

function promptHtml(again) {
  const here = present(), n = here.filter(s => ready.has(s)).length;
  if (!here.length) return 'Scan the code to join. Up to eight wizards.';
  if (n === here.length) return 'Here we go!';
  return `Everyone swipe <b>up</b> when ready &nbsp;${n}/${here.length}`;
}

function renderOverlays() {
  const lobby = mode === 'lobby', over = mode === 'play' && G.phase === 'over';
  $('lobby').classList.toggle('hidden', !lobby);
  $('results').classList.toggle('hidden', !over);
  $('corner').classList.toggle('hidden', lobby || over);
  const here = present();
  const logoH = Math.round(Math.min(innerHeight * 0.1, 96));
  if (lobby) {
    const html = `<div class="card panel">
      <div class="qrbox"><div class="qr">${qr}</div></div>
      <div>
        <div class="logo">${ptext('FINGER', logoH, 'white')} ${ptext('FROLIC', logoH, 'gold')}</div>
        <div class="tag">Monsters are marching on the castle. Your phone is your wand.</div>
        <div class="codeline">${ptext(room.room, Math.round(logoH * 0.85), 'gold')}<div class="lbl">Scan the code, or open<br><span class="url">${esc(url)}</span></div></div>
        ${stuckOnLocalhost(url) ? '<div class="warn">This page is on localhost, so phones can\'t reach it. Run <b>npm start</b> and open the address it prints.</div>' : ''}
        <div class="players">${playersHtml()}</div>
        ${diffHtml()}
        <div class="prompt">${promptHtml()} ${here.length ? '<button class="btn sm go" data-act="start">Start now</button>' : ''}</div>
      </div>
      ${HOW}
      <div class="foot"><span>Every fifth wave, a boss. It only falls when everyone clears their row.</span>${self === top ? '<a href="dev.html">Dev mode</a>' : ''}</div>
    </div>`;
    if ($('lobby').innerHTML !== html) $('lobby').innerHTML = html;
  }
  if (over) {
    const A = awards(G);
    const rows = ranking(G).map(([s, p], i) => `<tr><td class="n">${i < 3 ? pic('medal' + (i + 1), 40) : ptext(String(i + 1), 26)}</td>
      <td><span class="who" style="color:${seatColor(s)}">${esc(nameOf(s))}</span><span class="award">${pic(AWARD_ICON[A[s].icon] || 'brick', 22)}${esc(A[s].title)}</span>
        <small>${n(p.kills, 'monster')}, best combo ${p.best}, ${n(p.assists, 'assist')}, ${n(p.gifts, 'gift')}</small></td>
      <td class="s">${ptext(p.score.toLocaleString('en-US'), 30, i ? 'white' : 'gold')}</td></tr>`).join('');
    const html = `<div class="card panel">
      <div class="qrbox"><div class="qr">${qr}</div></div>
      <div>
        <div class="logo">${ptext('THE WALL FELL', Math.round(logoH * 0.8), 'white')}</div>
        <div class="tag">You held out until wave ${G.wave} on ${DIFFS[diff].label}.</div>
        <table class="rank">${rows}</table>
        ${diffHtml()}
        <div class="prompt">${promptHtml(true)} <button class="btn sm go" data-act="start">Play again</button> <button class="btn sm" data-act="lobby">Back to lobby</button></div>
      </div>
    </div>`;
    if ($('results').innerHTML !== html) $('results').innerHTML = html;
  }
  const corner = `<div class="qr">${qr}</div><div><div class="lbl">Join in</div>${ptext(room.room, 34, 'gold')}</div>`;
  if ($('corner').innerHTML !== corner) $('corner').innerHTML = corner;
}

document.addEventListener('click', e => {
  sfx.init(); $('sound').classList.add('hidden');
  const act = e.target.closest('[data-act]')?.dataset.act, d = e.target.closest('[data-diff]')?.dataset.diff;
  if (d) setDiff(0, d);
  if (act === 'start') beginCountdown();
  if (act === 'lobby') toLobby();
});
function toLobby() { sfx.stopMusic(); G = newGame(undefined, diff); mode = 'lobby'; ready.clear(); dirty = true; renderOverlays(); }
addEventListener('keydown', e => {
  sfx.init(); $('sound').classList.add('hidden');
  if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
  else if (e.key === 'm' || e.key === 'M') sfx.setMuted(!sfx.muted);
  else if (e.key === 'Escape') toLobby();
  else if ((e.key === ' ' || e.key === 'Enter') && (mode === 'lobby' || G.phase === 'over')) beginCountdown();
});

// ---------- telling the phones how they are doing ----------
// One broadcast carries every seat's numbers, so the relay sees ~6 messages a second however many play.
let dirty = true, lastSent = 0;
function snapshot() {
  const phase = mode === 'play' ? G.phase : mode, over = mode === 'play' && G.phase === 'over', A = over ? awards(G) : {};
  const p = {};
  for (const s of SEATS) {
    if (!room.seat(s)) continue;
    const q = G.players[s], lane = G.lanes.indexOf(s);
    // what my swipes would hit right now: 0 my own lane, 1 a neighbour's, 2 nothing
    const a = lane >= 0 && G.phase === 'wave' ? aim(G, lane) : null, at = a ? (a.lane === lane ? 0 : 1) : 2;
    const award = over && A[s] ? [A[s].icon, A[s].title, A[s].why] : null;
    // draw: the next thing this player has to do is draw a shape, so the phone switches to drawing
    const draw = a && isShapeToken(need(a.e, a.lane)) ? 1 : 0;
    p[s] = q ? [q.score, q.combo, Math.round(q.super * 100), q.stun > 0 ? 1 : 0, q.ev, q.last, lane, ready.has(s) ? 1 : 0, nameOf(s), at, award, draw, q.chain >= 2 && G.t - q.lastKill < 1.5 ? q.chain : 0, q.saves]
             : [0, 0, 0, 0, 0, '', -1, ready.has(s) ? 1 : 0, nameOf(s), 2, null, 0, 0, 0];
  }
  const rank = over ? ranking(G).map(([s]) => s) : null;
  return { t: 's', ph: phase, w: G.wave, h: G.hearts, cd: Math.ceil(mode === 'countdown' ? countdown : G.phase === 'break' ? G.timer : 0), n: present().length, p, rank,
    diff,
    fz: Math.round(G.frenzy * 100), fr: Math.ceil(G.frenzyT), ice: Math.ceil(G.freezeT), tev: G.tev, tl: G.tlast };
}
function sync(now) {
  if ((dirty && now - lastSent > 80) || now - lastSent > 300) { room.all(snapshot()); lastSent = now; dirty = false; }
}

// ---------- the loop ----------
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize); resize();

let last = performance.now(), lastModes = '';
const perf = []; // ms of work per frame, for ?debug
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const work0 = performance.now();
  // hit-stop: rules and effects hold still for a beat on a big hit (the screen still shakes)
  let gdt = dt; if (fx.stop > 0) { fx.stop -= dt; gdt = 0; fx.shake = Math.max(0, fx.shake - dt * 30); }
  const here = present();

  // seats whose phone has been gone a while are freed in the lobby, so the list shows who is really here
  for (const s of SEATS) {
    if (room.seat(s) && !live(s)) { offSince[s] ??= now; if ((mode === 'lobby' || G.phase === 'over') && now - offSince[s] > 15000) { room.free(s); ready.delete(s); delete offSince[s]; renderOverlays(); } }
    else delete offSince[s];
  }

  if (mode === 'lobby') {
    // stand everyone who has joined on the wall while they wait
    G.lanes = here; for (const s of here) addPlayer(G, s, nameOf(s));
    G.t += dt;
  } else if (mode === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt; G.t += dt;
    if (Math.ceil(countdown) !== before) { dirty = true; if (countdown > 0) sfx.beep(false); }
    banner(countdown > 0 ? String(Math.ceil(countdown)) : 'GO!', countdown > 0 ? 'white' : 'gold', '', 0.6);
    if (countdown <= 0) {
      if (!present().length) { toLobby(); }
      else { startGame(G, present()); for (const s of G.lanes) G.players[s].name = nameOf(s); mode = 'play'; sfx.beep(true); sfx.startMusic(120); dirty = true; renderOverlays(); }
    }
  } else if (mode === 'play') {
    const before = G.phase, ev = G.lanes.map(s => G.players[s]?.stun > 0);
    step(G, gdt, live);
    const modes = G.lanes.map((_, i) => { const a = aim(G, i); return a && isShapeToken(need(a.e, a.lane)) ? 1 : 0; }).join('');
    if (modes !== lastModes) { lastModes = modes; dirty = true; }
    if (G.lanes.some((s, i) => (G.players[s].stun > 0) !== ev[i])) dirty = true;
    if (breakOver(G)) { const next = present(); if (next.length) startWave(G, next); }
    if (G.phase !== before) { dirty = true; renderOverlays(); }
    drainLog();
  }

  tickFx(gdt, G, Lo);
  Lo = drawField(ctx, G, { W: cv.width, H: cv.height, live: s => mode !== 'play' || live(s), name: nameOf, maxHearts: DIFFS[G.diff]?.hearts });
  if (mode === 'lobby' || G.phase === 'over') drainLog();
  const b = $('banner'); b.style.opacity = now < bannerUntil ? 1 : 0;
  sync(now);
  perf.push(performance.now() - work0); if (perf.length > 120) perf.shift();
  requestAnimationFrame(frame);
}
$('sound').innerHTML = `${pic('mute', 22)} Click anywhere for sound`;
if (param('debug') != null) window.frolic = { get G() { return G; }, get mode() { return mode; }, need, aim, perf: () => { const a = [...perf].sort((x, y) => x - y); return { avg: a.reduce((x, y) => x + y, 0) / a.length, p95: a[Math.floor(a.length * 0.95)], max: a.at(-1) }; } }; // for tests and bots
renderOverlays();
requestAnimationFrame(frame);
setInterval(renderOverlays, 1000); // ready ticks and reconnecting labels
</script>
</body>
</html>
